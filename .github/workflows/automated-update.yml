name: Automated Brasileirão Update

on:
  schedule:
    # Horários em UTC.
    #
    # Brasilia (UTC-3):
    # 08:00 -> 11:00 UTC
    # 14:00 -> 17:00 UTC
    # 20:00 -> 23:00 UTC
    # 23:59 -> 02:59 UTC do dia seguinte
    #
    # O workflow roda todos os dias.
    # Se a CBF não mudou, nada é alterado.

    - cron: "0 11 * * *"
    - cron: "0 17 * * *"
    - cron: "0 23 * * *"
    - cron: "59 2 * * *"

  # Permite executar manualmente pela aba Actions.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automated-brasileirao-update
  cancel-in-progress: false


jobs:
  update:
    name: Check and Update Brasileirão

    # A CBF apresenta incompatibilidade de validação
    # da cadeia SSL no runner Linux.
    #
    # O scraper utiliza truststore, que no Windows
    # consegue validar corretamente o certificado da CBF.
    runs-on: windows-latest

    # Força o Python a utilizar UTF-8 no runner Windows.
    #
    # Sem isso, o stdout pode utilizar uma code page
    # incompatível com caracteres Unicode como ⚽ e ⚙️.
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    # Mantemos Bash para que os comandos do workflow
    # sejam iguais em todos os passos.
    defaults:
      run:
        shell: bash

    steps:

      # =======================================================================
      # Checkout
      # =======================================================================

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0


      # =======================================================================
      # Python
      # =======================================================================

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt


      # =======================================================================
      # Dependências
      # =======================================================================

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install project
        run: pip install -e .


      # =======================================================================
      # Atualização
      # =======================================================================

      - name: Check CBF and update project
        run: |
          python -m brasileirao_data_lab.pipelines.automated_project_update


      # =======================================================================
      # Detecta se realmente houve mudança
      # =======================================================================

      - name: Detect generated changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma alteracao encontrada."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Alteracoes encontradas."
            git status --short
          fi


      # =======================================================================
      # Testes
      #
      # Só executamos a suíte completa quando algum dado mudou.
      # =======================================================================

      - name: Run Python tests
        if: steps.changes.outputs.changed == 'true'
        run: pytest -q


      # =======================================================================
      # Mostra exatamente o que será publicado
      # =======================================================================

      - name: Show files to publish
        if: steps.changes.outputs.changed == 'true'
        run: |
          echo "Arquivos alterados:"
          git diff --name-only


      # =======================================================================
      # Git
      # =======================================================================

      - name: Configure Git
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "brasileirao-data-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


      # =======================================================================
      # Commit
      #
      # Adicionamos SOMENTE os arquivos de dados que a V0.7 pode atualizar.
      # =======================================================================

      - name: Commit updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add \
            data/brasileirao.db \
            data/processed/matches.csv \
            data/ml/matches_history.csv \
            data/ml/features.csv \
            data/ml/future_predictions.csv \
            data/ml/season_simulation.csv

          git commit -m "data: atualiza Brasileirao automaticamente"


      # =======================================================================
      # Push
      #
      # O novo commit em main dispara normalmente CI/deploy.
      # =======================================================================

      - name: Push updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git push origin HEAD:main


      # =======================================================================
      # Resumo
      # =======================================================================

      - name: No update required
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "CBF sem alteracoes."
          echo "Nenhum modelo foi recalculado."
          echo "Nenhum commit foi criado."


      - name: Update completed
        if: steps.changes.outputs.changed == 'true'
        run: |
          echo "Dados atualizados."
          echo "Testes aprovados."
          echo "Commit criado."
          echo "Atualizacao enviada para main."